events {
    worker_connections 1024;
}

http {
    # upstream to Go server
    upstream go_server {
        server go-server:9090;
    }

    server {
        listen 443 ssl;
        server_name nginx;

        # Server cert (step-ca signed)
        ssl_certificate     /certs/nginx.crt;
        ssl_certificate_key /certs/nginx-key.pem;

        # Require client cert (mTLS from Go client → nginx)
        ssl_client_certificate /certs/ca-chain.crt;  # step-ca intermediate + root
        ssl_verify_client on;

        # Proxy settings for WebSocket
        location / {
            proxy_pass https://go_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # mTLS to backend using nginx-proxy cert
            proxy_ssl_certificate     /certs/nginx-proxy.crt;
            proxy_ssl_certificate_key /certs/nginx-proxy-key.pem;
            proxy_ssl_trusted_certificate /certs/trust-chain.crt;  # Vault PKI intermediate + root
            proxy_ssl_verify on;
            proxy_ssl_name go-server;
            proxy_ssl_server_name on;

            # Forward client cert subject DN for mTLS identity federation
            proxy_set_header X-Forwarded-Ssl-Client-DN $ssl_client_s_dn;
        }
    }
}
