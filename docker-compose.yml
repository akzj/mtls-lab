# Zero-FAS mTLS Lab — Docker Compose
# Three-layer PKI: Root CA (YubiKey) → step-ca / Vault PKI → Leaf certs
# mTLS WebSocket communications: client → nginx → Go server
# Vault: secrets management with TLS certificate auth (mTLS)

services:

  # ──────────────────────────────────────────────
  # Vault — secrets engine + PKI intermediate (dev-tls mode)
  # ──────────────────────────────────────────────
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/data:/vault/data
      - ./certs:/certs:ro
      - ./scripts:/scripts:ro
    environment:
      - VAULT_API_ADDR=https://vault:8200
      - VAULT_DEV_ROOT_TOKEN_ID=root-token
    cap_add:
      - IPC_LOCK
    command: server -dev-tls -config=/vault/config/vault.hcl
    ports:
      - "8200:8200"
    extra_hosts:
      - "vault.lab.local:host-gateway"
      - "auth.lab.local:host-gateway"
      - "web.lab.local:host-gateway"
      - "nginx.lab.local:host-gateway"      
    healthcheck:
      test: ["CMD-SHELL", "vault status -tls-skip-verify 2>&1; test $$? -le 2"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # ──────────────────────────────────────────────
  # CoreDNS — DNS resolution for lab.local
  # ──────────────────────────────────────────────
  coredns:
    image: coredns/coredns:latest
    container_name: coredns
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    ports:
      - "5354:53/udp"
      - "5354:53/tcp"
    command: -conf /etc/coredns/Corefile
    restart: unless-stopped
    tty: true

  # ──────────────────────────────────────────────
  # Vault Init — one-shot PKI + KV + SSH + cert auth
  # ──────────────────────────────────────────────
  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init
    user: "0"
    volumes:
      - ./certs:/certs:ro
      - ./scripts:/scripts:ro
      - ./vault/policies:/vault/policies:ro
      - ssh-ca-pub:/ssh
      - ssh-ca-dc2-pub:/ssh-dc2
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_TOKEN=root-token
      - VAULT_TOKEN=root-token
      - VAULT_SKIP_VERIFY=true
    depends_on:
      vault:
        condition: service_healthy
    command: /bin/sh -c "
      echo 'All config managed by init-all.sh + Terraform'
      "
    restart: "no"

  # ──────────────────────────────────────────────
  # Go Server — mTLS WebSocket + Web UI + Tunnel
  # ──────────────────────────────────────────────
  go-server:
    build:
      context: ./go-server
      dockerfile: Dockerfile
    container_name: go-server
    volumes:
      - ./certs:/app/certs:ro
      - ./go-server/keys:/app/keys:ro
    environment:
      - VAULT_ADDR=https://vault:8200
    extra_hosts:
      - "vault.lab.local:host-gateway"
      - "auth.lab.local:host-gateway"
      - "web.lab.local:host-gateway"
      - "nginx.lab.local:host-gateway"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "9090:9090"
      - "9091:9091"
    restart: unless-stopped
    tty: true

  # ──────────────────────────────────────────────
  # nginx — mTLS reverse proxy with WebSocket
  # ──────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    ports:
      - "443:443"
    depends_on:
      - go-server
    restart: unless-stopped
    tty: true

  # ──────────────────────────────────────────────
  # step-ca — ACME certificate authority (TLS-ALPN-01)
  # ──────────────────────────────────────────────
  step-ca:
    build:
      context: .
      dockerfile: ./step-ca/Dockerfile
    container_name: step-ca
    volumes:
      - step-ca-db:/home/step/db
    ports:
      - "8443:8443"
    restart: unless-stopped
  # ──────────────────────────────────────────────
  # Go Client — ACME daemon + SSH server (via supervisord)
  # ──────────────────────────────────────────────
  go-client:
    build:
      context: ./go-client
      dockerfile: Dockerfile
    container_name: go-client
    tty: true
    volumes:
      - ./certs:/app/certs:ro
      - ./go-server/keys:/app/keys:ro
      - ./client-data:/app/data:rw
      - ssh-ca-pub:/ssh:ro
    environment:
      - STEPPATH=/app/data
    ports:
      - "22022:22"
    depends_on:
      - nginx
      - step-ca
    restart: unless-stopped
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    volumes:
      - ssh-ca-pub:/ssh:ro
    ports:
      - "2222:22"
    restart: unless-stopped
    tty: true

  # ──────────────────────────────────────────────
  # Gateway DC2 — SSH bastion with DC2 CA trust (multi-DC isolation demo)
  # ──────────────────────────────────────────────
  gateway-dc2:
    build:
      context: ./gateway-dc2
      dockerfile: Dockerfile
    container_name: gateway-dc2
    volumes:
      - ssh-ca-dc2-pub:/ssh:ro
    ports:
      - "2223:22"
    restart: unless-stopped
    tty: true

  # ──────────────────────────────────────────────
  # Internal App — only accessible via SSH tunnel
  # ──────────────────────────────────────────────
  internal-app:
    build:
      context: ./internal-app
      dockerfile: Dockerfile
    container_name: internal-app
    restart: unless-stopped
    tty: true

  # ──────────────────────────────────────────────
  # PostgreSQL — Authentik database
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: authentik-postgres
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # Redis — Authentik cache/queue
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: authentik-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # Authentik Server — OIDC identity provider
  # ──────────────────────────────────────────────
  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    command: server
    ports:
      - "9000:9000"
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_SECRET_KEY: authentik-lab-secret-key
      AUTHENTIK_TOKEN_LENGTH: "32"
      AUTHENTIK_BOOTSTRAP_TOKEN: authentik-bootstrap-token
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@zero-fas.local
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-custom-templates:/templates/custom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true

  # ──────────────────────────────────────────────
  # Authentik Worker — background tasks
  # ──────────────────────────────────────────────
  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_SECRET_KEY: authentik-lab-secret-key
      AUTHENTIK_TOKEN_LENGTH: "32"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-custom-templates:/templates/custom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ssh-ca-pub:
  ssh-ca-dc2-pub:
  postgres-data:
  authentik-media:
  authentik-templates:
  authentik-custom-templates:
  step-ca-db:
