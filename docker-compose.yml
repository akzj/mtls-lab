# Zero-FAS mTLS Lab — Docker Compose
# Three-layer PKI: Root CA (YubiKey) → step-ca / Vault PKI → Leaf certs
# mTLS WebSocket communications: client → nginx → Go server
# Vault: secrets management with TLS certificate auth (mTLS)

services:

  # ──────────────────────────────────────────────
  # Vault — secrets engine + PKI intermediate (dev-tls mode)
  # ──────────────────────────────────────────────
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/data:/vault/data
      - ./certs:/certs:ro
      - ./scripts:/scripts:ro
    environment:
      - VAULT_API_ADDR=https://vault:8200
      - VAULT_DEV_ROOT_TOKEN_ID=root-token
    cap_add:
      - IPC_LOCK
    command: server -dev-tls -config=/vault/config/vault.hcl
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status -tls-skip-verify 2>&1; test $$? -le 2"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # ──────────────────────────────────────────────
  # Vault Init — one-shot PKI + KV + SSH + cert auth
  # ──────────────────────────────────────────────
  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init
    user: "0"
    volumes:
      - ./certs:/certs:ro
      - ./scripts:/scripts:ro
      - ./vault/policies:/vault/policies:ro
      - ssh-ca-pub:/ssh
      - ssh-ca-dc2-pub:/ssh-dc2
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_TOKEN=root-token
      - VAULT_SKIP_VERIFY=true
    depends_on:
      vault:
        condition: service_healthy
    command: /bin/sh -c "
      /scripts/02-init-vault.sh && /scripts/03-init-users.sh && /scripts/04-init-ssh.sh && /scripts/05-init-ssh-dc2.sh
      "
    restart: "no"

  # ──────────────────────────────────────────────
  # Go Server — mTLS WebSocket + Web UI + Tunnel
  # ──────────────────────────────────────────────
  go-server:
    build:
      context: ./go-server
      dockerfile: Dockerfile
    container_name: go-server
    volumes:
      - ./certs:/app/certs:ro
    environment:
      - VAULT_ADDR=https://vault:8200
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "9090:9090"
      - "9091:9091"
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # nginx — mTLS reverse proxy with WebSocket
  # ──────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    ports:
      - "443:443"
    depends_on:
      - go-server
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # step-ca — ACME certificate authority (TLS-ALPN-01)
  # ──────────────────────────────────────────────
  step-ca:
    build:
      context: .
      dockerfile: ./step-ca/Dockerfile
    container_name: step-ca
    volumes:
      - step-ca-db:/home/step/db
    ports:
      - "8443:8443"
    restart: unless-stopped
  # ──────────────────────────────────────────────
  # Go Client — ACME daemon (long-running: registration + heartbeat + SSH + WS echo)
  # ──────────────────────────────────────────────
  go-client:
    build:
      context: ./go-client
      dockerfile: Dockerfile
    container_name: go-client
    volumes:
      - ./certs:/app/certs:ro
      - ./client-data:/app/data:rw
    environment:
      - STEPPATH=/app/data
    depends_on:
      - nginx
      - step-ca
    restart: unless-stopped  # ──────────────────────────────────────────────
  # Gateway — SSH bastion (唯一对外入口)
  # ──────────────────────────────────────────────
  # ──────────────────────────────────────────────
  # Gateway — SSH bastion (唯一对外入口)
  # ──────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    volumes:
      - ssh-ca-pub:/ssh:ro
    ports:
      - "2222:22"
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Gateway DC2 — SSH bastion with DC2 CA trust (multi-DC isolation demo)
  # ──────────────────────────────────────────────
  gateway-dc2:
    build:
      context: ./gateway-dc2
      dockerfile: Dockerfile
    container_name: gateway-dc2
    volumes:
      - ssh-ca-dc2-pub:/ssh:ro
    ports:
      - "2223:22"
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # SSH Server — internal SSH target (no external ports)
  # ──────────────────────────────────────────────
  ssh-server:
    build:
      context: ./ssh-server
      dockerfile: Dockerfile
    container_name: ssh-server
    volumes:
      - ssh-ca-pub:/ssh:ro
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Internal App — only accessible via SSH tunnel
  # ──────────────────────────────────────────────
  internal-app:
    build:
      context: ./internal-app
      dockerfile: Dockerfile
    container_name: internal-app
    restart: unless-stopped

volumes:
  ssh-ca-pub:
  ssh-ca-dc2-pub:
  step-ca-db:
