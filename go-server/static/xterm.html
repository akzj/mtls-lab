<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zero-FAS Terminal</title>
    <style>
        body { background: #1a1a2e; color: #e0e0e0; font-family: monospace; margin: 0; padding: 16px; }
        #output {
            background: #0d0d1a; border: 1px solid #333; padding: 12px;
            height: 55vh; overflow-y: auto; white-space: pre-wrap;
            font-size: 14px; line-height: 1.4;
        }
        #input-line { display: flex; margin-top: 8px; }
        #prompt { color: #4ecca3; padding-right: 8px; }
        #input {
            background: #0d0d1a; border: 1px solid #333; color: #e0e0e0;
            font-family: monospace; font-size: 14px; flex: 1; padding: 8px;
            outline: none;
        }
        #input:focus { border-color: #e94560; }
        #status { color: #f0c040; margin-bottom: 8px; font-size: 12px; }
        .header { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .header .title { color: #e94560; font-weight: bold; }
        .header .status { color: #4ecca3; font-size: 12px; }

        /* Tunnel Panel */
        #tunnel-btn {
            position: fixed; right: 5px; top: 40px; z-index: 100;
            background: #0f3460; color: #e94560; border: 1px solid #e94560;
            padding: 4px 8px; cursor: pointer; font-size: 12px;
        }
        #tunnel-btn:hover { background: #16213e; }
        #tunnel-panel {
            position: fixed; right: 0; top: 0; width: 300px; height: 100vh;
            background: #16213e; color: #e0e0e0; font-family: monospace;
            padding: 10px; border-left: 1px solid #0f3460;
            overflow-y: auto; display: none; z-index: 99;
        }
        #tunnel-panel h3 { color: #e94560; margin: 0 0 10px 0; font-size: 14px; }
        #tunnel-panel input, #tunnel-panel button {
            width: 100%; margin: 4px 0; padding: 6px; box-sizing: border-box;
        }
        #tunnel-panel input {
            background: #1a1a2e; color: #e0e0e0; border: 1px solid #0f3460; font-family: monospace; font-size: 12px;
        }
        #tunnel-panel button {
            background: #e94560; color: white; border: none; cursor: pointer; font-family: monospace; font-size: 12px;
        }
        #tunnel-panel button:hover { background: #d63851; }
        .tunnel-item {
            background: #1a1a2e; border: 1px solid #0f3460; padding: 8px; margin: 6px 0; font-size: 11px;
        }
        .tunnel-item .t-name { color: #4ecca3; font-weight: bold; }
        .tunnel-item .t-url { color: #e94560; }
        .tunnel-item .t-status { font-size: 10px; }
        .tunnel-item .t-status.active { color: #4ecca3; }
        .tunnel-item .t-status.error { color: #e94560; }
        #tunnel-error { color: #e94560; font-size: 11px; margin-top: 4px; display: none; }

        /* DC Selection Screen */
        #dc-select-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; background: #1a1a2e; color: #e0e0e0; font-family: monospace;
            padding: 40px 20px;
        }
        #dc-select-screen h2 { color: #e94560; margin-bottom: 10px; font-size: 28px; }
        #dc-select-screen p { color: #4ecca3; margin-bottom: 24px; font-size: 14px; }
        .dc-cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        .dc-card {
            background: #16213e; border: 2px solid #0f3460; border-radius: 12px;
            padding: 36px 30px; width: 220px; text-align: center; cursor: pointer;
            transition: all 0.2s ease;
        }
        .dc-card:hover { border-color: #e94560; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(233,69,96,0.15); }
        .dc-card .dc-icon { font-size: 48px; margin-bottom: 12px; }
        .dc-card h3 { color: #e94560; margin: 0 0 4px 0; font-size: 18px; }
        .dc-card .dc-desc { color: #4ecca3; font-size: 11px; margin: 0; }
        .dc-card .dc-detail { color: #888; font-size: 10px; margin-top: 8px; }
        /* Device List */
        .section-title { color: #e94560; font-size: 16px; margin: 0 0 16px 0; width: 100%; text-align: center; }
        #device-list { width: 100%; max-width: 600px; }
        .device-item {
            display: flex; align-items: center; padding: 10px 14px; margin: 6px 0;
            background: #16213e; border-radius: 8px; border: 1px solid #0f3460; font-size: 13px;
        }
        .device-item .dev-status { margin-right: 10px; font-size: 16px; }
        .device-item .dev-info { flex: 1; }
        .device-item .dev-info .dev-name { color: #4ecca3; font-weight: bold; }
        .device-item .dev-info .dev-meta { color: #888; font-size: 11px; }
        .device-item .dev-ssh-btn {
            background: #e94560; color: white; border: none; padding: 5px 14px;
            border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 12px;
        }
        .device-item .dev-ssh-btn:hover { background: #d63851; }
        .device-item .dev-ssh-btn:disabled { background: #555; cursor: not-allowed; }
        .loading-text { color: #4ecca3; font-size: 12px; text-align: center; width: 100%; }
        /* Back button */
        #back-btn {
            position: fixed; right: 50px; top: 5px; z-index: 100;
            background: #0f3460; color: white; border: 1px solid #e94560;
            padding: 2px 8px; cursor: pointer; font-size: 11px; font-family: monospace;
        }
        #back-btn:hover { background: #16213e; }
    </style>
</head>
<body>
    <!-- DC Selection Screen -->
    <div id="dc-select-screen">
        <h2>🔐 Zero-FAS Lab</h2>
        <p>Select a datacenter to connect:</p>
        <div class="dc-cards">
            <div class="dc-card" onclick="connectDC('1')">
                <div class="dc-icon">🏢</div>
                <h3>Datacenter DC1</h3>
                <p class="dc-desc">gateway:22</p>
                <p class="dc-detail">Vault SSH CA: ssh/</p>
            </div>
            <div class="dc-card" onclick="connectDC('2')">
                <div class="dc-icon">🏭</div>
                <h3>Datacenter DC2</h3>
                <p class="dc-desc">gateway-dc2:22</p>
                <p class="dc-detail">Vault SSH CA: ssh-dc2/</p>
            </div>
        </div>

        <!-- Device List -->
        <h3 class="section-title" style="margin-top:20px;">📡 Registered Devices</h3>
        <div id="device-list">
            <div class="loading-text">Loading devices...</div>
        </div>
    </div>

    <!-- Terminal Container (hidden until DC selected) -->
    <div id="terminal-container" style="display:none;">
        <div class="header">
            <span class="title" id="terminal-title">Zero-FAS Terminal</span>
            <span class="status" id="status">connecting...</span>
        </div>
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">$</span>
            <input type="text" id="input" placeholder="Type command and press Enter..." autofocus disabled>
        </div>

    </div> <!-- end terminal-container -->

    <!-- Tunnel toggle button -->
    <button id="tunnel-btn" onclick="toggleTunnelPanel()">🔌</button>
    <button id="back-btn" onclick="location.reload()">⬅ Back to DC select</button>

    <!-- Tunnel panel -->
    <div id="tunnel-panel">
        <h3>🔌 Tunnels</h3>
        <div>
            <input id="tunnel-host" placeholder="Target Host" value="internal-app">
            <input id="tunnel-port" placeholder="Target Port" value="80">
            <input id="tunnel-desc" placeholder="Description" value="internal-app web">
            <button onclick="createTunnel()">Create Tunnel</button>
            <div id="tunnel-error"></div>
        </div>
        <div id="tunnel-list" style="margin-top:10px;"></div>
    </div>

    <script>
    // WebSocket connection (established when user selects a DC)
    var ws = null;
    var termActive = false;
    var outputEl = document.getElementById('output');
    var inputEl = document.getElementById('input');
    var statusEl = document.getElementById('status');
    var promptEl = document.getElementById('prompt');
    var terminalTitle = document.getElementById('terminal-title');

    function log(text) {
        outputEl.textContent += text;
        outputEl.scrollTop = outputEl.scrollHeight;
    }

    function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.style.color = isError ? '#e94560' : '#4ecca3';
    }

    // Called when user clicks a DC card
    function connectDC(dc) {
        // Show terminal, hide DC select
        document.getElementById('dc-select-screen').style.display = 'none';
        document.getElementById('terminal-container').style.display = 'block';

        // Update title
        var name = dc === '2' ? 'DC2 gateway-dc2' : 'DC1 gateway';
        terminalTitle.textContent = 'Zero-FAS Terminal — ' + name + ' (Vault SSH CA)';

        // Connect WebSocket
        var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        var wsUrl = protocol + '//' + window.location.host + '/shell?dc=' + dc;

        log('Connecting to ' + wsUrl + '...\n');
        setStatus('connecting via Vault SSH CA (DC' + dc + ')...');

        try {
            ws = new WebSocket(wsUrl);
        } catch (e) {
            setStatus('❌ WebSocket error: ' + e.message, true);
            log('ERROR: ' + e.message + '\n');
            return;
        }

        ws.onopen = function() {
            setStatus('✅ SSH connected to DC' + dc + ' — type a command and press Enter');
            promptEl.textContent = 'gateway-user@' + (dc === '2' ? 'gateway-dc2' : 'gateway') + ':~$';
            inputEl.disabled = false;
            inputEl.focus();
            log('Connected! SSH session established via DC' + dc + '.\n');
            termActive = true;
        };

        ws.onclose = function(e) {
            setStatus('❌ Disconnected from DC' + dc + ' (code: ' + e.code + ')', true);
            inputEl.disabled = true;
            termActive = false;
            log('\nConnection closed.\n');
        };

        ws.onerror = function() {
            setStatus('❌ WebSocket error', true);
            inputEl.disabled = true;
            termActive = false;
            log('ERROR: WebSocket connection failed.\n');
        };

        ws.onmessage = function(event) {
            if (event.data instanceof Blob) {
                var reader = new FileReader();
                reader.onload = function() {
                    log(reader.result);
                };
                reader.readAsText(event.data);
            } else {
                log(event.data);
            }
        };

        // Handle Enter key in input
        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var cmd = inputEl.value;
                inputEl.value = '';
                log(cmd + '\n');
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(new TextEncoder().encode(cmd + '\n'));
                }
            }
        });

        // Resize
        window.addEventListener('resize', function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols: 80, rows: 24 }));
            }
        });

        console.log('Terminal connected to DC' + dc);
    }

    // ── Device List ──

    function fetchDevices() {
        fetch('/api/devices')
            .then(function(r) { return r.json(); })
            .then(function(devices) {
                var list = document.getElementById('device-list');
                if (!list) return;
                if (devices.length === 0) {
                    list.innerHTML = '<div class="loading-text">No devices registered yet.</div>';
                    return;
                }
                var html = '';
                devices.forEach(function(d) {
                    var statusIcon = d.online ? '🟢' : '🔴';
                    var disabled = d.online ? '' : 'disabled';
                    html +=
                        '<div class="device-item">' +
                            '<span class="dev-status">' + statusIcon + '</span>' +
                            '<div class="dev-info">' +
                                '<div class="dev-name">' + escapeHtml(d.id) + '</div>' +
                                '<div class="dev-meta">' + escapeHtml(d.label) + ' | DC' + d.dc + ' | ' + escapeHtml(d.ssh_target) + '</div>' +
                            '</div>' +
                            '<button class="dev-ssh-btn" onclick="sshToDevice(\'' + d.id + '\')" ' + disabled + '>SSH</button>' +
                        '</div>';
                });
                list.innerHTML = html;
            })
            .catch(function() {
                var list = document.getElementById('device-list');
                if (list) list.innerHTML = '<div class="loading-text" style="color:#e94560;">Failed to load devices</div>';
            });
    }

    // SSH to a registered device
    function sshToDevice(deviceID) {
        // Show terminal, hide DC select
        document.getElementById('dc-select-screen').style.display = 'none';
        document.getElementById('terminal-container').style.display = 'block';

        terminalTitle.textContent = 'Zero-FAS Terminal — Device ' + deviceID;

        var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        var wsUrl = protocol + '//' + window.location.host + '/shell/device?device_id=' + deviceID;

        log('Connecting to device ' + deviceID + '...\n');
        setStatus('connecting to ' + deviceID + '...');

        try {
            ws = new WebSocket(wsUrl);
        } catch (e) {
            setStatus('❌ WebSocket error: ' + e.message, true);
            log('ERROR: ' + e.message + '\n');
            return;
        }

        ws.onopen = function() {
            setStatus('✅ SSH connected to ' + deviceID + ' — type a command and press Enter');
            promptEl.textContent = deviceID + ':~$';
            inputEl.disabled = false;
            inputEl.focus();
            log('Connected! SSH session established to ' + deviceID + '.\n');
            termActive = true;
        };

        ws.onclose = function(e) {
            setStatus('❌ Disconnected from ' + deviceID + ' (code: ' + e.code + ')', true);
            inputEl.disabled = true;
            termActive = false;
            log('\nConnection closed.\n');
        };

        ws.onerror = function() {
            setStatus('❌ WebSocket error', true);
            inputEl.disabled = true;
            termActive = false;
            log('ERROR: WebSocket connection failed.\n');
        };

        ws.onmessage = function(event) {
            if (event.data instanceof Blob) {
                var reader = new FileReader();
                reader.onload = function() {
                    log(reader.result);
                };
                reader.readAsText(event.data);
            } else {
                log(event.data);
            }
        };

        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var cmd = inputEl.value;
                inputEl.value = '';
                log(cmd + '\n');
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(new TextEncoder().encode(cmd + '\n'));
                }
            }
        });

        window.addEventListener('resize', function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols: 80, rows: 24 }));
            }
        });

        console.log('Terminal connected to ' + deviceID);
    }

    // ── Tunnel Management ──

    function toggleTunnelPanel() {
        var panel = document.getElementById('tunnel-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function showTunnelError(msg) {
        var el = document.getElementById('tunnel-error');
        el.textContent = msg;
        el.style.display = msg ? 'block' : 'none';
    }

    function createTunnel() {
        var host = document.getElementById('tunnel-host').value;
        var port = parseInt(document.getElementById('tunnel-port').value);
        var desc = document.getElementById('tunnel-desc').value;

        if (!host || !port) {
            showTunnelError('Host and port required');
            return;
        }
        showTunnelError('');

        fetch('/api/tunnel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                target_host: host,
                target_port: port,
                description: desc
            })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                showTunnelError(data.error);
                return;
            }
            addTunnelToList(data);
        })
        .catch(function(err) {
            showTunnelError('Request failed: ' + err.message);
        });
    }

    function addTunnelToList(tunnel) {
        var list = document.getElementById('tunnel-list');
        var div = document.createElement('div');
        div.className = 'tunnel-item';
        div.id = 'tunnel-' + tunnel.id;
        div.innerHTML =
            '<div class="t-name">' + escapeHtml(tunnel.description) + '</div>' +
            '<div class="t-url">→ <a href="' + tunnel.url + '" target="_blank" style="color:#e94560;">' + tunnel.url + '</a></div>' +
            '<div class="t-status active">● active (' + tunnel.target_host + ':' + tunnel.target_port + ')</div>';
        list.appendChild(div);
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Initial load + periodic refresh
    fetchDevices();
    setInterval(fetchDevices, 10000);
    </script>
</body>
</html>
