<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zero-FAS Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- xterm.js -->
    <link href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
</head>
<body class="bg-[#1a1a2e] text-gray-200 font-mono m-0 p-0 overflow-hidden h-screen">

<div x-data="app()">
    <!-- ===== Header Bar ===== -->
    <div class="bg-[#16213e] border-b border-[#0f3460] px-4 py-2 flex justify-between items-center">
        <span class="text-[#e94560] font-bold text-sm">Zero-FAS Lab Terminal</span>
        <div class="flex items-center gap-3">
            <span x-show="authenticated" class="text-[#4ecca3] text-xs">👤 <span x-text="user"></span></span>
            <a x-show="authenticated" href="/auth/logout" class="text-[#e94560] text-xs hover:underline">Logout</a>
            <a x-show="!authenticated" href="/auth/login" class="text-[#4ecca3] text-xs hover:underline">Login</a>
        </div>
    </div>

    <!-- ===== DC Selection Screen ===== -->
    <div x-show="screen === 'dc-select'" class="flex flex-col items-center justify-center h-[calc(100vh-40px)] px-4">
        <h2 class="text-[#e94560] text-2xl mb-4">🔐 Zero-FAS Lab</h2>
        <p class="text-[#4ecca3] mb-8 text-sm">Select a datacenter or device to connect:</p>

        <!-- DC Cards -->
        <div class="flex gap-6 mb-10 flex-wrap justify-center">
            <div @click="connectDC('1')"
                class="bg-[#16213e] border-2 border-[#0f3460] rounded-xl p-8 w-56 text-center cursor-pointer
                       hover:border-[#e94560] hover:-translate-y-1 hover:shadow-lg hover:shadow-[#e94560]/10 transition-all duration-200">
                <div class="text-5xl mb-3">🏢</div>
                <h3 class="text-[#e94560] font-bold text-lg">Datacenter DC1</h3>
                <p class="text-[#4ecca3] text-xs mt-1">gateway:22</p>
                <p class="text-gray-500 text-2xs mt-2">Vault SSH CA: ssh/</p>
            </div>
            <div @click="connectDC('2')"
                class="bg-[#16213e] border-2 border-[#0f3460] rounded-xl p-8 w-56 text-center cursor-pointer
                       hover:border-[#e94560] hover:-translate-y-1 hover:shadow-lg hover:shadow-[#e94560]/10 transition-all duration-200">
                <div class="text-5xl mb-3">🏭</div>
                <h3 class="text-[#e94560] font-bold text-lg">Datacenter DC2</h3>
                <p class="text-[#4ecca3] text-xs mt-1">gateway-dc2:22</p>
                <p class="text-gray-500 text-2xs mt-2">Vault SSH CA: ssh-dc2/</p>
            </div>
        </div>

        <!-- Device List -->
        <div class="w-full max-w-lg">
            <h4 class="text-gray-400 text-xs mb-3 text-center">📡 Registered Devices</h4>
            <template x-for="d in devices" :key="d.id">
                <div class="flex items-center gap-3 bg-[#16213e] rounded-lg px-4 py-3 mb-2 border border-[#0f3460]">
                    <span x-text="d.online ? '🟢' : '🔴'" class="text-sm"></span>
                    <div class="flex-1 min-w-0">
                        <div class="text-[#4ecca3] text-sm font-bold truncate" x-text="d.id"></div>
                        <div class="text-gray-400 text-2xs truncate" x-text="d.label + ' | DC' + d.dc + ' | ' + d.ssh_target"></div>
                    </div>
                    <button @click="sshToDevice(d.id)"
                        :disabled="!d.online"
                        :class="d.online ? 'bg-[#e94560] hover:bg-[#d63851] cursor-pointer' : 'bg-gray-600 cursor-not-allowed'"
                        class="text-white text-xs px-3 py-1.5 rounded border-0 transition-colors whitespace-nowrap">SSH</button>
                </div>
            </template>
            <div x-show="devices.length === 0" class="text-gray-500 text-xs text-center py-4">No devices registered yet.</div>
        </div>
    </div>

    <!-- ===== Terminal Screen ===== -->
    <div x-show="screen === 'terminal'" class="h-[calc(100vh-40px)] relative">
        <div id="terminal" class="h-full w-full"></div>

        <!-- Back to DC select -->
        <button @click="backToSelect()"
            class="fixed top-1 left-2 z-50 bg-[#0f3460] text-white border border-[#e94560] rounded px-2 py-0.5 cursor-pointer text-2xs hover:bg-[#16213e]">
            ⬅ Back
        </button>

        <!-- Tunnel toggle button -->
        <button @click="toggleTunnel()"
            class="fixed top-1 right-2 z-50 bg-[#0f3460] text-[#e94560] border border-[#e94560] rounded px-2 py-1 cursor-pointer text-base hover:bg-[#16213e]">
            🔌
        </button>

        <!-- Tunnel sidebar -->
        <div :class="tunnelOpen ? 'right-0' : '-right-80'"
            class="fixed top-10 w-72 h-[calc(100vh-40px)] bg-[#16213e] border-l border-[#0f3460] p-3 overflow-y-auto z-40 transition-all duration-300">
            <h3 class="text-[#e94560] text-sm font-bold mb-3">🔌 Tunnels</h3>

            <!-- Input form -->
            <div class="flex gap-1 mb-3 flex-wrap">
                <input x-model="tunnelHost" placeholder="Host" value="internal-app"
                    class="flex-1 min-w-0 bg-[#1a1a2e] text-gray-200 border border-[#0f3460] rounded px-2 py-1 text-xs">
                <input x-model="tunnelPort" placeholder="Port" value="80"
                    class="w-14 bg-[#1a1a2e] text-gray-200 border border-[#0f3460] rounded px-2 py-1 text-xs">
                <input x-model="tunnelDesc" placeholder="Desc" value="app"
                    class="w-16 bg-[#1a1a2e] text-gray-200 border border-[#0f3460] rounded px-2 py-1 text-xs">
                <button @click="createTunnel()"
                    class="bg-[#e94560] text-white px-2 py-1 rounded text-xs border-0 cursor-pointer hover:bg-[#d63851] whitespace-nowrap">➕ Add</button>
            </div>

            <!-- Tunnel error -->
            <div x-show="tunnelError" x-text="tunnelError" class="text-[#e94560] text-2xs mb-2"></div>

            <!-- Tunnel list -->
            <template x-for="t in tunnels" :key="t.id">
                <div class="bg-[#1a1a2e] border border-[#0f3460] rounded-lg p-2.5 mb-2 flex justify-between items-center">
                    <div class="flex-1 min-w-0">
                        <div class="text-[#4ecca3] text-xs font-bold truncate" x-text="t.description"></div>
                        <div class="text-gray-400 text-2xs" x-text="t.target_host + ':' + t.target_port"></div>
                    </div>
                    <div class="flex items-center gap-2 ml-2 shrink-0">
                        <span :class="t.status === 'active' ? 'bg-green-900 text-green-300 border-green-500' : 'bg-red-900 text-red-300 border-red-500'"
                            class="px-2 py-0.5 rounded-full text-2xs border" x-text="t.status"></span>
                        <a :href="t.url" target="_blank" class="text-[#e94560] text-xs no-underline hover:underline">↗</a>
                    </div>
                </div>
            </template>
            <div x-show="tunnels.length === 0" class="text-gray-500 text-2xs text-center py-2">No tunnels</div>
        </div>
    </div>
</div>

<script>
// ===== Alpine.js Root Application =====
function app() {
    return {
        screen: 'dc-select',
        authenticated: false,
        user: null,
        devices: [],
        tunnels: [],
        tunnelOpen: false,
        tunnelHost: 'internal-app',
        tunnelPort: '80',
        tunnelDesc: 'app',
        tunnelError: '',
        ws: null,
        term: null,
        fitAddon: null,

        init() {
            // Check session
            axios.get('/api/session').then(resp => {
                if (resp.data.authenticated) {
                    this.authenticated = true;
                    this.user = resp.data.user;
                }
            }).catch(() => {});

            // Fetch devices
            this.fetchDevices();
            setInterval(() => this.fetchDevices(), 10000);
        },

        fetchDevices() {
            axios.get('/api/devices').then(resp => {
                this.devices = resp.data || [];
            }).catch(() => {});
        },

        connectDC(dc) {
            this.screen = 'terminal';
            this.$nextTick(() => this.initTerminal(dc));
        },

        sshToDevice(deviceId) {
            this.screen = 'terminal';
            this.$nextTick(() => this.initDeviceSSH(deviceId));
        },

        backToSelect() {
            // Clean up existing terminal
            if (this.ws) {
                this.ws.close();
                this.ws = null;
            }
            if (this.term) {
                this.term.dispose();
                this.term = null;
                this.fitAddon = null;
            }
            this.screen = 'dc-select';
        },

        toggleTunnel() {
            this.tunnelOpen = !this.tunnelOpen;
        },

        createTunnel() {
            var host = this.tunnelHost;
            var port = parseInt(this.tunnelPort);
            var desc = this.tunnelDesc;

            if (!host || !port) {
                this.tunnelError = 'Host and port required';
                return;
            }
            this.tunnelError = '';

            axios.post('/api/tunnel', {
                target_host: host,
                target_port: port,
                description: desc
            }).then(resp => {
                if (resp.data.error) {
                    this.tunnelError = resp.data.error;
                } else {
                    this.tunnels.push(resp.data);
                }
            }).catch(err => {
                this.tunnelError = 'Request failed: ' + err.message;
            });
        },

        // ===== xterm.js Initialization =====

        initTerminal(dc) {
            var term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Menlo, Monaco, "Courier New", monospace',
                theme: { background: '#1a1a2e', foreground: '#e0e0e0', cursor: '#e94560' }
            });
            var fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('terminal'));
            fitAddon.fit();

            this.term = term;
            this.fitAddon = fitAddon;

            var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsUrl = protocol + '//' + window.location.host + '/shell?dc=' + dc;
            var statusEl = document.createElement('div');
            statusEl.id = 'term-status';

            try {
                var ws = new WebSocket(wsUrl);
                this.ws = ws;
            } catch (e) {
                term.write('WebSocket error: ' + e.message + '\r\n');
                return;
            }

            ws.onopen = function() {
                term.write('Connected! SSH session via DC' + dc + '.\r\n');
                term.focus();
            };

            term.onData(function(data) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                }
            });

            ws.onclose = function() {
                term.write('\r\nConnection closed.\r\n');
            };

            ws.onerror = function() {
                term.write('WebSocket error.\r\n');
            };

            ws.onmessage = function(event) {
                if (event.data instanceof Blob) {
                    var reader = new FileReader();
                    reader.onload = function() { term.write(reader.result); };
                    reader.readAsText(event.data);
                } else {
                    term.write(event.data);
                }
            };

            // Terminal → WebSocket
            term.onData(function(data) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(new TextEncoder().encode(data));
                }
            });

            // Resize
            window.addEventListener('resize', function onResize() {
                fitAddon.fit();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
                }
            });
        },

        initDeviceSSH(deviceId) {
            var term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Menlo, Monaco, "Courier New", monospace',
                theme: { background: '#1a1a2e', foreground: '#e0e0e0', cursor: '#e94560' }
            });
            var fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('terminal'));
            fitAddon.fit();

            this.term = term;
            this.fitAddon = fitAddon;

            var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsUrl = protocol + '//' + window.location.host + '/shell/device?device_id=' + deviceId;

            try {
                var ws = new WebSocket(wsUrl);
                this.ws = ws;
            } catch (e) {
                term.write('WebSocket error: ' + e.message + '\r\n');
                return;
            }

            ws.onopen = function() {
                term.write('Connected to device ' + deviceId + '.\r\n');
                term.focus();
            };

            ws.onclose = function() {
                term.write('\r\nConnection closed.\r\n');
            };

            ws.onerror = function() {
                term.write('WebSocket error.\r\n');
            };

            ws.onmessage = function(event) {
                if (event.data instanceof Blob) {
                    var reader = new FileReader();
                    reader.onload = function() { term.write(reader.result); };
                    reader.readAsText(event.data);
                } else {
                    term.write(event.data);
                }
            };

            term.onData(function(data) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(new TextEncoder().encode(data));
                }
            });

            window.addEventListener('resize', function onResize() {
                fitAddon.fit();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
                }
            });
        }
    };
}
</script>
</body>
</html>
